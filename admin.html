<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>問題管理 - AI vs. Campus Explorers</title>


    <style>

        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }


        h1 {
            margin-bottom: 10px;
        }


        .description {
            margin-bottom: 30px;
        }


        #status {
            font-weight: bold;
            margin: 20px 0;
        }


        #problemList {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }


        .problem-card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);

            max-width: 800px;
        }


        .problem-image {
            width: 100%;
            max-width: 600px;
            display: block;
            margin-bottom: 20px;
            border-radius: 5px;
        }


        .photo-id {
            font-weight: bold;
            margin-bottom: 15px;
        }


        .info {
            margin-top: 15px;
            padding: 15px;
            background-color: #f7f7f7;
            border-radius: 5px;
        }


        .info p {
            margin: 7px 0;
        }


        label {
            display: block;
            font-weight: bold;
            margin-top: 20px;
        }


        input,
        textarea {
            box-sizing: border-box;

            width: 100%;
            max-width: 600px;

            font-size: 16px;

            padding: 10px;

            margin-top: 5px;

            border: 1px solid #ccc;
            border-radius: 5px;
        }


        textarea {
            min-height: 120px;
            resize: vertical;
        }


        .save-button {
            margin-top: 20px;

            font-size: 18px;

            padding: 10px 25px;

            cursor: pointer;
        }


        .save-button:disabled {
            cursor: not-allowed;
        }


        .save-status {
            margin-top: 10px;
            font-weight: bold;
        }


        .no-problems {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

    </style>

</head>


<body>


    <h1>
        問題管理
    </h1>


    <p class="description">
        登録した問題の写真を確認しながら、
        場所名や紹介文を編集できます。
    </p>


    <p id="status">
        問題を読み込んでいます...
    </p>


    <div id="problemList"></div>


    <!-- ====================================== -->
    <!-- Supabase -->
    <!-- ====================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <script>


        // ==========================================
        // Supabase設定
        // ==========================================

        const SUPABASE_URL =
            "https://feakwjvyedqhalvzldiy.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_8XvING1KLsUjD49e3oj00A_6sYvoRV4";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        // ==========================================
        // 問題を取得
        // ==========================================

        async function loadProblems() {


            const status =
                document.getElementById("status");


            const problemList =
                document.getElementById("problemList");


            try {


                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("problems")
                        .select("*")
                        .order(
                            "created_at",
                            {
                                ascending: false
                            }
                        );


                if (error) {

                    throw error;

                }


                problemList.innerHTML = "";


                // 問題がまだない場合
                if (!data || data.length === 0) {

                    status.textContent =
                        "登録された問題はありません。";


                    problemList.innerHTML =
                        '<div class="no-problems">' +
                        'まだ問題が登録されていません。' +
                        '</div>';

                    return;
                }


                status.textContent =
                    data.length +
                    "件の問題が登録されています。";


                // ==================================
                // 1件ずつ表示
                // ==================================

                data.forEach(problem => {

                    createProblemCard(problem);

                });


            } catch (error) {


                console.error(error);


                status.textContent =
                    "問題の読み込みに失敗しました。";


                problemList.innerHTML =
                    "<p>" +
                    error.message +
                    "</p>";

            }

        }


        // ==========================================
        // 問題カードを作成
        // ==========================================

        function createProblemCard(problem) {


            const problemList =
                document.getElementById(
                    "problemList"
                );


            const card =
                document.createElement("div");


            card.className =
                "problem-card";


            // ======================================
            // 写真
            // ======================================

            const image =
                document.createElement("img");


            image.className =
                "problem-image";


            image.src =
                problem.image_url;


            image.alt =
                problem.place_name ||
                "問題画像";


            // ======================================
            // 元写真ID
            // ======================================

            const photoId =
                document.createElement("p");


            photoId.className =
                "photo-id";


            photoId.textContent =
                "元写真ID：" +
                (problem.photo_id || "なし");


            // ======================================
            // 撮影情報
            // ======================================

            const info =
                document.createElement("div");


            info.className =
                "info";


            info.innerHTML =

                "<p>" +
                "緯度：" +
                (problem.latitude ?? "-") +
                "</p>" +

                "<p>" +
                "経度：" +
                (problem.longitude ?? "-") +
                "</p>" +

                "<p>" +
                "GPS精度：" +
                (problem.gps_accuracy != null
                    ? problem.gps_accuracy.toFixed(1) + " m"
                    : "-") +
                "</p>" +

                "<p>" +
                "方位（alpha）：" +
                (problem.alpha != null
                    ? problem.alpha.toFixed(1) + "°"
                    : "-") +
                "</p>" +

                "<p>" +
                "上下角度（beta）：" +
                (problem.beta != null
                    ? problem.beta.toFixed(1) + "°"
                    : "-") +
                "</p>" +

                "<p>" +
                "左右の傾き（gamma）：" +
                (problem.gamma != null
                    ? problem.gamma.toFixed(1) + "°"
                    : "-") +
                "</p>" +

                "<p>" +
                "撮影日時：" +
                formatDate(problem.captured_at) +
                "</p>";


            // ======================================
            // 場所名
            // ======================================

            const placeLabel =
                document.createElement("label");


            placeLabel.textContent =
                "場所名";


            const placeInput =
                document.createElement("input");


            placeInput.type =
                "text";


            placeInput.value =
                problem.place_name || "";


            placeInput.placeholder =
                "例：NITech 正門";


            placeLabel.appendChild(
                placeInput
            );


            // ======================================
            // 紹介文
            // ======================================

            const descriptionLabel =
                document.createElement("label");


            descriptionLabel.textContent =
                "紹介文";


            const descriptionInput =
                document.createElement("textarea");


            descriptionInput.value =
                problem.description || "";


            descriptionInput.placeholder =
                "この場所の紹介文を入力してください。";


            descriptionLabel.appendChild(
                descriptionInput
            );


            // ======================================
            // 保存ボタン
            // ======================================

            const saveButton =
                document.createElement("button");


            saveButton.className =
                "save-button";


            saveButton.textContent =
                "💾 保存";


            // ======================================
            // 保存結果
            // ======================================

            const saveStatus =
                document.createElement("p");


            saveStatus.className =
                "save-status";


            // ======================================
            // 保存ボタン処理
            // ======================================

            saveButton.addEventListener(
                "click",
                async () => {


                    const placeName =
                        placeInput.value.trim();


                    const description =
                        descriptionInput.value.trim();


                    if (!placeName) {

                        saveStatus.textContent =
                            "場所名を入力してください。";

                        return;
                    }


                    if (!description) {

                        saveStatus.textContent =
                            "紹介文を入力してください。";

                        return;
                    }


                    saveButton.disabled =
                        true;


                    saveButton.textContent =
                        "保存中...";


                    saveStatus.textContent =
                        "";


                    try {


                        const {
                            error
                        } =
                            await supabaseClient
                                .from("problems")
                                .update({

                                    place_name:
                                        placeName,

                                    description:
                                        description

                                })
                                .eq(
                                    "id",
                                    problem.id
                                );


                        if (error) {

                            throw error;

                        }


                        saveStatus.textContent =
                            "✅ 保存しました！";


                        saveButton.textContent =
                            "保存完了";


                        // 2秒後に通常状態へ
                        setTimeout(() => {

                            saveButton.disabled =
                                false;

                            saveButton.textContent =
                                "💾 保存";

                        }, 2000);


                    } catch (error) {


                        console.error(error);


                        saveStatus.textContent =
                            "❌ 保存に失敗しました。";


                        saveButton.disabled =
                            false;


                        saveButton.textContent =
                            "💾 保存";

                    }

                }
            );


            // ======================================
            // カードに追加
            // ======================================

            card.appendChild(image);

            card.appendChild(photoId);

            card.appendChild(info);

            card.appendChild(placeLabel);

            card.appendChild(descriptionLabel);

            card.appendChild(saveButton);

            card.appendChild(saveStatus);


            problemList.appendChild(card);

        }


        // ==========================================
        // 日付を読みやすくする
        // ==========================================

        function formatDate(dateString) {


            if (!dateString) {

                return "-";

            }


            const date =
                new Date(dateString);


            return date.toLocaleString(
                "ja-JP"
            );

        }


        // ==========================================
        // ページ読み込み時に実行
        // ==========================================

        loadProblems();


    </script>

</body>

</html>
