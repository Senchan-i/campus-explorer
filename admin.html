<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>管理者メイン画面</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #222;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    main {
      max-width: 600px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .menu-button {
      display: block;
      width: 100%;
      box-sizing: border-box;

      margin-bottom: 15px;
      padding: 20px;

      border: none;
      border-radius: 12px;

      background: white;
      color: #222;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;

      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .menu-button:hover {
      background: #eeeeee;
    }

    .menu-number {
      display: inline-block;
      width: 30px;
      text-align: left;
    }

    .coming-soon {
      color: #888;
      font-size: 13px;
      font-weight: normal;
      margin-left: 8px;
    }
  </style>
</head>

<body>

  <header>
    <h1>管理者メイン画面</h1>
  </header>

  <main>

    <button class="menu-button"
            onclick="location.href='admin-capture.html'">
      <span class="menu-number">①</span>
      画像を撮る
    </button>

    <button class="menu-button"
            onclick="location.href='prompt-admin.html'">
      <span class="menu-number">②</span>
      プロンプト入力
      <span class="coming-soon"></span>
    </button>

    <button class="menu-button"
            onclick="location.href='set-create.html'">
      <span class="menu-number">③</span>
      セットを生成
      <span class="coming-soon"></span>
    </button>

    <button class="menu-button"
            onclick="location.href='problem-list.html'">
      <span class="menu-number">④</span>
      画像一覧
      <span class="coming-soon"></span>
    </button>

    <button class="menu-button"
            onclick="location.href='prompt-list.html'">
      <span class="menu-number">⑤</span>
      プロンプト一覧
      <span class="coming-soon"></span>
    </button>

    <button class="menu-button"
            onclick="location.href='set-list.html'">
      <span class="menu-number">⑥</span>
      セット一覧
      <span class="coming-soon"></span>
    </button>

  </main>

</body>
</html>
