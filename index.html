<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI vs. Campus Explorers</title>

    <style>

        body {
            font-family: sans-serif;
            margin: 20px;
        }

        button {
            font-size: 18px;
            padding: 10px 20px;
            margin: 5px 0;
        }

        #camera {
            width: 100%;
            max-width: 500px;
            display: block;
            margin-top: 10px;
            background-color: black;
        }

        #takePhotoButton {
            width: 100%;
            max-width: 500px;
            font-size: 22px;
            padding: 15px;
            margin-top: 10px;
        }

        #photoPreview {
            width: 100%;
            max-width: 500px;
            margin-top: 10px;
        }

        .section {
            margin-top: 30px;
        }

    </style>

</head>


<body>

    <h1>AI vs. Campus Explorers</h1>


    <!-- ====================================== -->
    <!-- 端末の向き・傾き -->
    <!-- ====================================== -->

    <div class="section">

        <h2>端末の向き・傾き</h2>

        <button id="orientationButton">
            センサーを開始
        </button>

        <p>
            alpha：
            <span id="alpha">-</span>°
        </p>

        <p>
            beta：
            <span id="beta">-</span>°
        </p>

        <p>
            gamma：
            <span id="gamma">-</span>°
        </p>

        <p id="orientationStatus"></p>

    </div>


    <!-- ====================================== -->
    <!-- 撮影開始 -->
    <!-- ====================================== -->

    <div class="section">

        <h2>撮影</h2>

        <button id="startButton">
            📷 撮影開始
        </button>

        <p id="shootingStatus"></p>

    </div>


    <!-- ====================================== -->
    <!-- カメラ -->
    <!-- ====================================== -->

    <div
        id="cameraArea"
        class="section"
        style="display: none;"
    >

        <h2>カメラ</h2>

        <p>
            その場で止まってください。
        </p>

        <video
            id="camera"
            autoplay
            playsinline
        ></video>

        <button id="takePhotoButton">
            📸 撮影
        </button>

    </div>


    <!-- ====================================== -->
    <!-- 撮影した写真 -->
    <!-- ====================================== -->

    <div
        id="photoArea"
        class="section"
        style="display: none;"
    >

        <h2>撮影した写真</h2>

        <img
            id="photoPreview"
            alt="撮影した写真"
        >

    </div>


    <!-- ====================================== -->
    <!-- 撮影情報 -->
    <!-- ====================================== -->

    <div
        id="infoArea"
        class="section"
        style="display: none;"
    >

        <h2>撮影情報</h2>

        <p>
            緯度：
            <span id="latitude">-</span>
        </p>

        <p>
            経度：
            <span id="longitude">-</span>
        </p>

        <p>
            GPS精度：
            <span id="accuracy">-</span>
        </p>

        <p>
            alpha：
            <span id="photoAlpha">-</span>°
        </p>

        <p>
            beta：
            <span id="photoBeta">-</span>°
        </p>

        <p>
            gamma：
            <span id="photoGamma">-</span>°
        </p>

        <p>
            撮影日時：
            <span id="timestamp">-</span>
        </p>

    </div>


    <script>


        // ==========================================
        // 現在のセンサー情報
        // ==========================================

        let currentAlpha = null;
        let currentBeta = null;
        let currentGamma = null;


        // ==========================================
        // 撮影時のGPS情報
        // ==========================================

        let currentLatitude = null;
        let currentLongitude = null;
        let currentAccuracy = null;


        // ==========================================
        // カメラ
        // ==========================================

        let cameraStream = null;


        // ==========================================
        // センサー開始
        // ==========================================

        document
            .getElementById("orientationButton")
            .addEventListener("click", async () => {


                // iPhoneなどで許可が必要な場合
                if (
                    typeof DeviceOrientationEvent !== "undefined" &&
                    typeof DeviceOrientationEvent.requestPermission === "function"
                ) {

                    try {

                        const permission =
                            await DeviceOrientationEvent.requestPermission();


                        if (permission !== "granted") {

                            document
                                .getElementById("orientationStatus")
                                .textContent =
                                "センサーの使用が許可されませんでした。";

                            return;
                        }

                    } catch (error) {

                        document
                            .getElementById("orientationStatus")
                            .textContent =
                            "センサーの許可取得に失敗しました。";

                        return;
                    }

                }


                // センサー情報を受け取る
                window.addEventListener(
                    "deviceorientation",
                    handleOrientation
                );


                document
                    .getElementById("orientationStatus")
                    .textContent =
                    "センサーを取得しています！";

            });


        // ==========================================
        // センサー情報を更新
        // ==========================================

        function handleOrientation(event) {


            currentAlpha = event.alpha;
            currentBeta = event.beta;
            currentGamma = event.gamma;


            document
                .getElementById("alpha")
                .textContent =
                currentAlpha !== null
                    ? currentAlpha.toFixed(1)
                    : "-";


            document
                .getElementById("beta")
                .textContent =
                currentBeta !== null
                    ? currentBeta.toFixed(1)
                    : "-";


            document
                .getElementById("gamma")
                .textContent =
                currentGamma !== null
                    ? currentGamma.toFixed(1)
                    : "-";

        }


        // ==========================================
        // 撮影開始
        // ==========================================

        document
            .getElementById("startButton")
            .addEventListener("click", () => {


                document
                    .getElementById("shootingStatus")
                    .textContent =
                    "📍 位置情報を取得しています...";


                // GPSに対応しているか確認
                if (!navigator.geolocation) {

                    document
                        .getElementById("shootingStatus")
                        .textContent =
                        "このブラウザは位置情報に対応していません。";

                    return;
                }


                // GPS取得
                navigator.geolocation.getCurrentPosition(

                    // ------------------------------
                    // GPS取得成功
                    // ------------------------------

                    (position) => {


                        currentLatitude =
                            position.coords.latitude;

                        currentLongitude =
                            position.coords.longitude;

                        currentAccuracy =
                            position.coords.accuracy;


                        // GPS情報を表示
                        document
                            .getElementById("latitude")
                            .textContent =
                            currentLatitude;


                        document
                            .getElementById("longitude")
                            .textContent =
                            currentLongitude;


                        document
                            .getElementById("accuracy")
                            .textContent =
                            currentAccuracy.toFixed(1) + " m";


                        document
                            .getElementById("shootingStatus")
                            .textContent =
                            "📍 位置情報を取得しました！";


                        // カメラを起動
                        startCamera();

                    },


                    // ------------------------------
                    // GPS取得失敗
                    // ------------------------------

                    (error) => {

                        document
                            .getElementById("shootingStatus")
                            .textContent =
                            "位置情報を取得できませんでした。";

                        console.error(error);

                    },

                    // ------------------------------
                    // GPS取得オプション
                    // ------------------------------

                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }

                );

            });


        // ==========================================
        // カメラ起動
        // ==========================================

        async function startCamera() {


            try {


                cameraStream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {

                            // 背面カメラを優先
                            facingMode: {
                                ideal: "environment"
                            }

                        },

                        // マイクは使用しない
                        audio: false

                    });


                const video =
                    document.getElementById("camera");


                video.srcObject =
                    cameraStream;


                // カメラエリアを表示
                document
                    .getElementById("cameraArea")
                    .style.display =
                    "block";


                document
                    .getElementById("shootingStatus")
                    .textContent =
                    "📷 カメラを起動しました！";


            } catch (error) {


                console.error(error);


                document
                    .getElementById("shootingStatus")
                    .textContent =
                    "カメラを起動できませんでした。";

            }

        }


        // ==========================================
        // 撮影ボタン
        // ==========================================

        document
            .getElementById("takePhotoButton")
            .addEventListener("click", () => {


                const video =
                    document.getElementById("camera");


                // Canvasを作成
                const canvas =
                    document.createElement("canvas");


                canvas.width =
                    video.videoWidth;

                canvas.height =
                    video.videoHeight;


                // Canvasに現在のカメラ映像を描画
                const context =
                    canvas.getContext("2d");


                context.drawImage(

                    video,

                    0,
                    0,

                    canvas.width,
                    canvas.height

                );


                // 写真データに変換
                const imageURL =
                    canvas.toDataURL("image/jpeg");


                // 写真を表示
                document
                    .getElementById("photoPreview")
                    .src =
                    imageURL;


                document
                    .getElementById("photoArea")
                    .style.display =
                    "block";


                // ==================================
                // 撮影した瞬間のアングルを記録
                // ==================================

                document
                    .getElementById("photoAlpha")
                    .textContent =
                    currentAlpha !== null
                        ? currentAlpha.toFixed(1)
                        : "-";


                document
                    .getElementById("photoBeta")
                    .textContent =
                    currentBeta !== null
                        ? currentBeta.toFixed(1)
                        : "-";


                document
                    .getElementById("photoGamma")
                    .textContent =
                    currentGamma !== null
                        ? currentGamma.toFixed(1)
                        : "-";


                // ==================================
                // 撮影日時
                // ==================================

                const timestamp =
                    new Date();


                document
                    .getElementById("timestamp")
                    .textContent =
                    timestamp.toLocaleString();


                // ==================================
                // 撮影情報を表示
                // ==================================

                document
                    .getElementById("infoArea")
                    .style.display =
                    "block";


                document
                    .getElementById("shootingStatus")
                    .textContent =
                    "📸 撮影完了！";


                // ==================================
                // カメラを停止
                // ==================================

                if (cameraStream) {

                    cameraStream
                        .getTracks()
                        .forEach(track => track.stop());

                }


                cameraStream = null;

            });


    </script>

</body>

</html>
