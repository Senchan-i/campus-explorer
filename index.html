<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI vs. Campus Explorers</title>
</head>

<body>

    <h1>AI vs. Campus Explorers</h1>


    <!-- ==================== -->
    <!-- センサー -->
    <!-- ==================== -->

    <h2>端末の向き・傾き</h2>

    <button id="orientationButton">
        センサーを開始
    </button>

    <p>alpha：<span id="alpha">-</span>°</p>
    <p>beta：<span id="beta">-</span>°</p>
    <p>gamma：<span id="gamma">-</span>°</p>

    <p id="orientationStatus"></p>


    <!-- ==================== -->
    <!-- 撮影 -->
    <!-- ==================== -->

    <h2>撮影</h2>

    <button id="startButton">
        撮影開始
    </button>

    <p id="shootingStatus"></p>


    <!-- GPS取得後に表示する -->
    <div id="cameraArea" style="display: none;">

        <p>
            その場で止まってください。
        </p>

        <p>
            GPSの取得が完了しました。
            写真を撮影してください。
        </p>

        <input
            type="file"
            id="cameraInput"
            accept="image/*"
            capture="environment"
        >

    </div>


    <!-- ==================== -->
    <!-- 撮影した写真 -->
    <!-- ==================== -->

    <div id="photoArea" style="display: none;">

        <h2>撮影した写真</h2>

        <img
            id="photoPreview"
            style="max-width: 100%;"
        >

    </div>


    <!-- ==================== -->
    <!-- 撮影情報 -->
    <!-- ==================== -->

    <div id="infoArea" style="display: none;">

        <h2>撮影情報</h2>

        <p>
            緯度：
            <span id="latitude">-</span>
        </p>

        <p>
            経度：
            <span id="longitude">-</span>
        </p>

        <p>
            精度：
            <span id="accuracy">-</span>
        </p>

        <p>
            alpha：
            <span id="photoAlpha">-</span>°
        </p>

        <p>
            beta：
            <span id="photoBeta">-</span>°
        </p>

        <p>
            gamma：
            <span id="photoGamma">-</span>°
        </p>

        <p>
            撮影日時：
            <span id="timestamp">-</span>
        </p>

    </div>


    <script>

        // ========================================
        // 現在のセンサー情報
        // ========================================

        let currentAlpha = null;
        let currentBeta = null;
        let currentGamma = null;


        // ========================================
        // 撮影時のGPS情報
        // ========================================

        let currentLatitude = null;
        let currentLongitude = null;
        let currentAccuracy = null;


        // ========================================
        // センサー開始
        // ========================================

        document.getElementById("orientationButton")
            .addEventListener("click", async () => {

                if (
                    typeof DeviceOrientationEvent !== "undefined" &&
                    typeof DeviceOrientationEvent.requestPermission === "function"
                ) {

                    try {

                        const permission =
                            await DeviceOrientationEvent.requestPermission();

                        if (permission !== "granted") {

                            document.getElementById("orientationStatus")
                                .textContent =
                                "センサーの使用が許可されませんでした。";

                            return;
                        }

                    } catch (error) {

                        document.getElementById("orientationStatus")
                            .textContent =
                            "センサーの許可取得に失敗しました。";

                        return;
                    }
                }

                window.addEventListener(
                    "deviceorientation",
                    handleOrientation
                );

                document.getElementById("orientationStatus")
                    .textContent =
                    "センサーを取得しています！";

            });


        // ========================================
        // センサー情報を更新
        // ========================================

        function handleOrientation(event) {

            currentAlpha = event.alpha;
            currentBeta = event.beta;
            currentGamma = event.gamma;


            document.getElementById("alpha")
                .textContent =
                currentAlpha !== null
                    ? currentAlpha.toFixed(1)
                    : "-";


            document.getElementById("beta")
                .textContent =
                currentBeta !== null
                    ? currentBeta.toFixed(1)
                    : "-";


            document.getElementById("gamma")
                .textContent =
                currentGamma !== null
                    ? currentGamma.toFixed(1)
                    : "-";

        }


        // ========================================
        // 撮影開始
        // ========================================

        document.getElementById("startButton")
            .addEventListener("click", () => {

                document.getElementById("shootingStatus")
                    .textContent =
                    "📍 位置情報を取得しています...";


                // GPSに対応しているか確認
                if (!navigator.geolocation) {

                    document.getElementById("shootingStatus")
                        .textContent =
                        "このブラウザは位置情報に対応していません。";

                    return;
                }


                // GPS取得
                navigator.geolocation.getCurrentPosition(

                    (position) => {

                        // GPS情報を保存
                        currentLatitude =
                            position.coords.latitude;

                        currentLongitude =
                            position.coords.longitude;

                        currentAccuracy =
                            position.coords.accuracy;


                        // 画面に表示
                        document.getElementById("latitude")
                            .textContent =
                            currentLatitude;

                        document.getElementById("longitude")
                            .textContent =
                            currentLongitude;

                        document.getElementById("accuracy")
                            .textContent =
                            currentAccuracy.toFixed(1) + " m";


                        // ステータス変更
                        document.getElementById("shootingStatus")
                            .textContent =
                            "📍 位置情報を取得しました！";


                        // カメラを表示
                        document.getElementById("cameraArea")
                            .style.display = "block";

                    },


                    (error) => {

                        document.getElementById("shootingStatus")
                            .textContent =
                            "位置情報を取得できませんでした。";

                    }

                );

            });


        // ========================================
        // 写真撮影
        // ========================================

        document.getElementById("cameraInput")
            .addEventListener("change", (event) => {

                const file =
                    event.target.files[0];

                if (!file) {
                    return;
                }


                // ------------------------------
                // 写真を表示
                // ------------------------------

                const imageURL =
                    URL.createObjectURL(file);

                document.getElementById("photoPreview")
                    .src = imageURL;

                document.getElementById("photoArea")
                    .style.display = "block";


                // ------------------------------
                // 撮影日時
                // ------------------------------

                const timestamp =
                    new Date();

                document.getElementById("timestamp")
                    .textContent =
                    timestamp.toLocaleString();


                // ------------------------------
                // 撮影時のアングル
                // ------------------------------

                document.getElementById("photoAlpha")
                    .textContent =
                    currentAlpha !== null
                        ? currentAlpha.toFixed(1)
                        : "-";

                document.getElementById("photoBeta")
                    .textContent =
                    currentBeta !== null
                        ? currentBeta.toFixed(1)
                        : "-";

                document.getElementById("photoGamma")
                    .textContent =
                    currentGamma !== null
                        ? currentGamma.toFixed(1)
                        : "-";


                // ------------------------------
                // 撮影情報を表示
                // ------------------------------

                document.getElementById("infoArea")
                    .style.display = "block";


                document.getElementById("shootingStatus")
                    .textContent =
                    "📸 撮影完了！";

            });

    </script>

</body>

</html>
