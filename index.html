<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI vs. Campus Explorers</title>
</head>

<body>

    <h1>AI vs. Campus Explorers</h1>

    <h2>端末の向き・傾き</h2>

    <button id="orientationButton">
        センサーを開始
    </button>

    <p>alpha：<span id="alpha">-</span>°</p>
    <p>beta：<span id="beta">-</span>°</p>
    <p>gamma：<span id="gamma">-</span>°</p>

    <p id="orientationStatus"></p>


    <script>

        // 「センサーを開始」ボタン
        document.getElementById("orientationButton").addEventListener("click", async () => {

            // iPhoneなど、許可を求める必要がある場合
            if (
                typeof DeviceOrientationEvent !== "undefined" &&
                typeof DeviceOrientationEvent.requestPermission === "function"
            ) {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();

                    if (permission !== "granted") {
                        document.getElementById("orientationStatus").textContent =
                            "センサーの使用が許可されませんでした。";
                        return;
                    }

                } catch (error) {
                    document.getElementById("orientationStatus").textContent =
                        "センサーの許可取得に失敗しました。";
                    return;
                }
            }

            // センサー情報を受け取る
            window.addEventListener("deviceorientation", handleOrientation);

            document.getElementById("orientationStatus").textContent =
                "センサーを取得しています！";
        });


        // センサーの値が変化したときに呼ばれる
        function handleOrientation(event) {

            const alpha = event.alpha;
            const beta = event.beta;
            const gamma = event.gamma;

            document.getElementById("alpha").textContent =
                alpha !== null ? alpha.toFixed(1) : "-";

            document.getElementById("beta").textContent =
                beta !== null ? beta.toFixed(1) : "-";

            document.getElementById("gamma").textContent =
                gamma !== null ? gamma.toFixed(1) : "-";
        }

    </script>

</body>

</html>
