<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI vs. Campus Explorers</title>


    <style>

        body {
            font-family: sans-serif;
            margin: 20px;
        }


        button {
            font-size: 18px;
            padding: 10px 20px;
            margin: 5px 0;
        }


        input,
        textarea {
            box-sizing: border-box;
            width: 100%;
            max-width: 500px;
            font-size: 18px;
            padding: 10px;
            margin-top: 5px;
        }


        textarea {
            min-height: 120px;
            resize: vertical;
        }


        #camera {
            width: 100%;
            max-width: 500px;
            display: block;
            margin-top: 10px;
            background-color: black;
        }


        #takePhotoButton {
            width: 100%;
            max-width: 500px;
            font-size: 22px;
            padding: 15px;
            margin-top: 10px;
        }


        #photoPreview {
            width: 100%;
            max-width: 500px;
            margin-top: 10px;
        }


        #registerButton {
            width: 100%;
            max-width: 500px;
            font-size: 22px;
            padding: 15px;
            margin-top: 20px;
        }


        .section {
            margin-top: 30px;
        }


        .input-group {
            margin-top: 20px;
            max-width: 500px;
        }


        #registerStatus {
            font-weight: bold;
            margin-top: 15px;
        }

    </style>

</head>


<body>

    <h1>AI vs. Campus Explorers</h1>


    <!-- ====================================== -->
    <!-- センサー -->
    <!-- ====================================== -->

    <div class="section">

        <h2>端末の向き・傾き</h2>

        <button id="orientationButton">
            センサーを開始
        </button>

        <p>
            alpha：
            <span id="alpha">-</span>°
        </p>

        <p>
            beta：
            <span id="beta">-</span>°
        </p>

        <p>
            gamma：
            <span id="gamma">-</span>°
        </p>

        <p id="orientationStatus"></p>

    </div>


    <!-- ====================================== -->
    <!-- 撮影開始 -->
    <!-- ====================================== -->

    <div class="section">

        <h2>撮影</h2>

        <button id="startButton">
            📷 撮影開始
        </button>

        <p id="shootingStatus"></p>

    </div>


    <!-- ====================================== -->
    <!-- カメラ -->
    <!-- ====================================== -->

    <div
        id="cameraArea"
        class="section"
        style="display: none;"
    >

        <h2>カメラ</h2>

        <p>
            その場で止まってください。
        </p>

        <video
            id="camera"
            autoplay
            playsinline
        ></video>

        <button id="takePhotoButton">
            📸 撮影
        </button>

    </div>


    <!-- ====================================== -->
    <!-- 撮影した写真 -->
    <!-- ====================================== -->

    <div
        id="photoArea"
        class="section"
        style="display: none;"
    >

        <h2>撮影した写真</h2>

        <img
            id="photoPreview"
            alt="撮影した写真"
        >

    </div>


    <!-- ====================================== -->
    <!-- 撮影情報 -->
    <!-- ====================================== -->

    <div
        id="infoArea"
        class="section"
        style="display: none;"
    >

        <h2>撮影情報</h2>

        <p>
            緯度：
            <span id="latitude">-</span>
        </p>

        <p>
            経度：
            <span id="longitude">-</span>
        </p>

        <p>
            GPS精度：
            <span id="accuracy">-</span>
        </p>

        <p>
            方位（alpha）：
            <span id="photoAlpha">-</span>°
        </p>

        <p>
            上下角度（beta）：
            <span id="photoBeta">-</span>°
        </p>

        <p>
            左右の傾き（gamma）：
            <span id="photoGamma">-</span>°
        </p>

        <p>
            撮影日時：
            <span id="timestamp">-</span>
        </p>

    </div>


    <!-- ====================================== -->
    <!-- 問題情報入力 -->
    <!-- ====================================== -->

    <div
        id="problemInputArea"
        class="section"
        style="display: none;"
    >

        <h2>問題情報</h2>


        <div class="input-group">

            <label for="placeName">
                場所名
            </label>

            <input
                type="text"
                id="placeName"
                placeholder="例：NITech 正門"
            >

        </div>


        <div class="input-group">

            <label for="description">
                紹介文
            </label>

            <textarea
                id="description"
                placeholder="例：名古屋工業大学の正門です。"
            ></textarea>

        </div>


        <button id="registerButton">
            💾 問題として登録
        </button>


        <p id="registerStatus"></p>

    </div>


    <!-- ====================================== -->
    <!-- Supabase -->
    <!-- ====================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>


        // ==========================================
        // Supabase設定
        // ==========================================

        const SUPABASE_URL =
            "https://feakwjvyedqhalvzldiy.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_8XvING1KLsUjD49e3oj00A_6sYvoRV4";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        // ==========================================
        // 現在のセンサー情報
        // ==========================================

        let currentAlpha = null;
        let currentBeta = null;
        let currentGamma = null;


        // ==========================================
        // GPS情報
        // ==========================================

        let currentLatitude = null;
        let currentLongitude = null;
        let currentAccuracy = null;


        // ==========================================
        // 撮影した画像
        // ==========================================

        let capturedImageURL = null;


        // ==========================================
        // 撮影日時
        // ==========================================

        let capturedAt = null;


        // ==========================================
        // カメラ
        // ==========================================

        let cameraStream = null;


        // ==========================================
        // センサー開始
        // ==========================================

        document
            .getElementById("orientationButton")
            .addEventListener("click", async () => {


                if (
                    typeof DeviceOrientationEvent !== "undefined" &&
                    typeof DeviceOrientationEvent.requestPermission === "function"
                ) {

                    try {

                        const permission =
                            await DeviceOrientationEvent.requestPermission();


                        if (permission !== "granted") {

                            document
                                .getElementById("orientationStatus")
                                .textContent =
                                "センサーの使用が許可されませんでした。";

                            return;
                        }

                    } catch (error) {

                        document
                            .getElementById("orientationStatus")
                            .textContent =
                            "センサーの許可取得に失敗しました。";

                        return;
                    }

                }


                window.addEventListener(
                    "deviceorientation",
                    handleOrientation
                );


                document
                    .getElementById("orientationStatus")
                    .textContent =
                    "センサーを取得しています！";

            });


        // ==========================================
        // センサー情報更新
        // ==========================================

        function handleOrientation(event) {

            currentAlpha = event.alpha;
            currentBeta = event.beta;
            currentGamma = event.gamma;


            document
                .getElementById("alpha")
                .textContent =
                currentAlpha !== null
                    ? currentAlpha.toFixed(1)
                    : "-";


            document
                .getElementById("beta")
                .textContent =
                currentBeta !== null
                    ? currentBeta.toFixed(1)
                    : "-";


            document
                .getElementById("gamma")
                .textContent =
                currentGamma !== null
                    ? currentGamma.toFixed(1)
                    : "-";

        }


        // ==========================================
        // 撮影開始
        // ==========================================

        document
            .getElementById("startButton")
            .addEventListener("click", () => {


                document
                    .getElementById("shootingStatus")
                    .textContent =
                    "📍 位置情報を取得しています...";


                if (!navigator.geolocation) {

                    document
                        .getElementById("shootingStatus")
                        .textContent =
                        "このブラウザは位置情報に対応していません。";

                    return;
                }


                navigator.geolocation.getCurrentPosition(

                    (position) => {


                        currentLatitude =
                            position.coords.latitude;

                        currentLongitude =
                            position.coords.longitude;

                        currentAccuracy =
                            position.coords.accuracy;


                        document
                            .getElementById("latitude")
                            .textContent =
                            currentLatitude;


                        document
                            .getElementById("longitude")
                            .textContent =
                            currentLongitude;


                        document
                            .getElementById("accuracy")
                            .textContent =
                            currentAccuracy.toFixed(1) + " m";


                        document
                            .getElementById("shootingStatus")
                            .textContent =
                            "📍 位置情報を取得しました！";


                        startCamera();

                    },


                    (error) => {

                        document
                            .getElementById("shootingStatus")
                            .textContent =
                            "位置情報を取得できませんでした。";

                        console.error(error);

                    },


                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }

                );

            });


        // ==========================================
        // カメラ起動
        // ==========================================

        async function startCamera() {

            try {

                cameraStream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {

                            facingMode: {
                                ideal: "environment"
                            }

                        },

                        audio: false

                    });


                const video =
                    document.getElementById("camera");


                video.srcObject =
                    cameraStream;


                document
                    .getElementById("cameraArea")
                    .style.display =
                    "block";


                document
                    .getElementById("shootingStatus")
                    .textContent =
                    "📷 カメラを起動しました！";


            } catch (error) {

                console.error(error);


                document
                    .getElementById("shootingStatus")
                    .textContent =
                    "カメラを起動できませんでした。";

            }

        }


        // ==========================================
        // 撮影
        // ==========================================

        document
            .getElementById("takePhotoButton")
            .addEventListener("click", () => {


                const video =
                    document.getElementById("camera");


                const canvas =
                    document.createElement("canvas");


                canvas.width =
                    video.videoWidth;

                canvas.height =
                    video.videoHeight;


                const context =
                    canvas.getContext("2d");


                context.drawImage(

                    video,

                    0,
                    0,

                    canvas.width,
                    canvas.height

                );


                capturedImageURL =
                    canvas.toDataURL("image/jpeg", 0.9);


                document
                    .getElementById("photoPreview")
                    .src =
                    capturedImageURL;


                document
                    .getElementById("photoArea")
                    .style.display =
                    "block";


                // 撮影時のセンサー値
                document
                    .getElementById("photoAlpha")
                    .textContent =
                    currentAlpha !== null
                        ? currentAlpha.toFixed(1)
                        : "-";


                document
                    .getElementById("photoBeta")
                    .textContent =
                    currentBeta !== null
                        ? currentBeta.toFixed(1)
                        : "-";


                document
                    .getElementById("photoGamma")
                    .textContent =
                    currentGamma !== null
                        ? currentGamma.toFixed(1)
                        : "-";


                // 撮影日時
                capturedAt =
                    new Date();


                document
                    .getElementById("timestamp")
                    .textContent =
                    capturedAt.toLocaleString();


                // 情報表示
                document
                    .getElementById("infoArea")
                    .style.display =
                    "block";


                // 入力欄表示
                document
                    .getElementById("problemInputArea")
                    .style.display =
                    "block";


                document
                    .getElementById("shootingStatus")
                    .textContent =
                    "📸 撮影完了！場所名と紹介文を入力してください。";


                // カメラ停止
                if (cameraStream) {

                    cameraStream
                        .getTracks()
                        .forEach(track => track.stop());

                }


                cameraStream = null;

            });


        // ==========================================
        // 元写真IDを作成
        // ==========================================

        function createPhotoId() {


            const now =
                new Date();


            const year =
                now.getFullYear();


            const month =
                String(now.getMonth() + 1)
                    .padStart(2, "0");


            const day =
                String(now.getDate())
                    .padStart(2, "0");


            const hour =
                String(now.getHours())
                    .padStart(2, "0");


            const minute =
                String(now.getMinutes())
                    .padStart(2, "0");


            const second =
                String(now.getSeconds())
                    .padStart(2, "0");


            const random =
                Math.random()
                    .toString(36)
                    .substring(2, 6);


            return (
                "P-" +
                year +
                month +
                day +
                "-" +
                hour +
                minute +
                second +
                "-" +
                random
            );

        }


        // ==========================================
        // 問題として登録
        // ==========================================

        document
            .getElementById("registerButton")
            .addEventListener("click", registerProblem);


        async function registerProblem() {


            // --------------------------------------
            // 入力内容
            // --------------------------------------

            const placeName =
                document
                    .getElementById("placeName")
                    .value
                    .trim();


            const description =
                document
                    .getElementById("description")
                    .value
                    .trim();


            // --------------------------------------
            // 入力チェック
            // --------------------------------------

            if (!capturedImageURL) {

                document
                    .getElementById("registerStatus")
                    .textContent =
                    "写真がありません。";

                return;
            }


            if (!placeName) {

                document
                    .getElementById("registerStatus")
                    .textContent =
                    "場所名を入力してください。";

                return;
            }


            if (!description) {

                document
                    .getElementById("registerStatus")
                    .textContent =
                    "紹介文を入力してください。";

                return;
            }


            if (
                currentLatitude === null ||
                currentLongitude === null
            ) {

                document
                    .getElementById("registerStatus")
                    .textContent =
                    "位置情報がありません。";

                return;
            }


            // --------------------------------------
            // 登録中表示
            // --------------------------------------

            const registerButton =
                document.getElementById(
                    "registerButton"
                );


            registerButton.disabled = true;


            registerButton.textContent =
                "登録しています...";


            document
                .getElementById("registerStatus")
                .textContent =
                "画像とデータをSupabaseに保存しています。";


            try {


                // ==================================
                // ① 元写真IDを作る
                // ==================================

                const photoId =
                    createPhotoId();


                // ==================================
                // ② Data URL → Blob
                // ==================================

                const response =
                    await fetch(capturedImageURL);


                const imageBlob =
                    await response.blob();


                // ==================================
                // ③ Storageへ画像アップロード
                // ==================================

                const filePath =
                    photoId + ".jpg";


                const {
                    data: uploadData,
                    error: uploadError
                } =
                    await supabaseClient
                        .storage
                        .from("problem-images")
                        .upload(
                            filePath,
                            imageBlob,
                            {
                                contentType: "image/jpeg",
                                upsert: false
                            }
                        );


                if (uploadError) {

                    throw uploadError;

                }


                console.log(
                    "画像アップロード成功：",
                    uploadData
                );


                // ==================================
                // ④ 公開URLを取得
                // ==================================

                const {
                    data: publicURLData
                } =
                    supabaseClient
                        .storage
                        .from("problem-images")
                        .getPublicUrl(filePath);


                const imageURL =
                    publicURLData.publicUrl;


                // ==================================
                // ⑤ データベースへ保存
                // ==================================

                const {
                    data: databaseData,
                    error: databaseError
                } =
                    await supabaseClient
                        .from("problems")
                        .insert({

                            photo_id: photoId,

                            image_url: imageURL,

                            latitude:
                                currentLatitude,

                            longitude:
                                currentLongitude,

                            gps_accuracy:
                                currentAccuracy,

                            alpha:
                                currentAlpha,

                            beta:
                                currentBeta,

                            gamma:
                                currentGamma,

                            place_name:
                                placeName,

                            description:
                                description,

                            captured_at:
                                capturedAt.toISOString()

                        })
                        .select();


                if (databaseError) {

                    throw databaseError;

                }


                console.log(
                    "データベース登録成功：",
                    databaseData
                );


                // ==================================
                // ⑥ 完了
                // ==================================

                document
                    .getElementById("registerStatus")
                    .textContent =
                    "🎉 問題を登録しました！";


                document
                    .getElementById("shootingStatus")
                    .textContent =
                    "問題の登録が完了しました！";


                registerButton.textContent =
                    "登録完了";


                // 元写真IDを表示
                const registeredPhotoId =
                    document.createElement("p");


                registeredPhotoId.textContent =
                    "元写真ID：" + photoId;


                document
                    .getElementById("problemInputArea")
                    .appendChild(
                        registeredPhotoId
                    );


            } catch (error) {


                console.error(
                    "登録エラー：",
                    error
                );


                document
                    .getElementById("registerStatus")
                    .textContent =
                    "❌ 登録に失敗しました。エラーを確認してください。";


                registerButton.disabled = false;


                registerButton.textContent =
                    "💾 問題として登録";

            }

        }

    </script>

</body>

</html>
