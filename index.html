<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI vs. Campus Explorers</title>
</head>

<body>

    <h1>AI vs. Campus Explorers</h1>


    <!-- ==================== -->
    <!-- センサー開始 -->
    <!-- ==================== -->

    <h2>端末の向き・傾き</h2>

    <button id="orientationButton">
        センサーを開始
    </button>

    <p>alpha：<span id="alpha">-</span>°</p>
    <p>beta：<span id="beta">-</span>°</p>
    <p>gamma：<span id="gamma">-</span>°</p>

    <p id="orientationStatus"></p>


    <!-- ==================== -->
    <!-- 写真撮影 -->
    <!-- ==================== -->

    <h2>写真撮影</h2>

    <input
        type="file"
        id="cameraInput"
        accept="image/*"
        capture="environment"
    >

    <p id="photoStatus"></p>

    <img
        id="photoPreview"
        style="max-width: 100%; display: none;"
    >


    <!-- ==================== -->
    <!-- 撮影情報 -->
    <!-- ==================== -->

    <h2>撮影情報</h2>

    <p>緯度：<span id="latitude">-</span></p>
    <p>経度：<span id="longitude">-</span></p>
    <p>精度：<span id="accuracy">-</span></p>

    <p>alpha：<span id="photoAlpha">-</span>°</p>
    <p>beta：<span id="photoBeta">-</span>°</p>
    <p>gamma：<span id="photoGamma">-</span>°</p>

    <p>撮影日時：<span id="timestamp">-</span></p>

    <p id="locationStatus"></p>


    <script>

        // ========================================
        // 現在のセンサー情報を保存しておく
        // ========================================

        let currentAlpha = null;
        let currentBeta = null;
        let currentGamma = null;


        // ========================================
        // 端末の向き・傾き
        // ========================================

        document.getElementById("orientationButton")
            .addEventListener("click", async () => {

                // iPhoneなどで許可が必要な場合
                if (
                    typeof DeviceOrientationEvent !== "undefined" &&
                    typeof DeviceOrientationEvent.requestPermission === "function"
                ) {

                    try {

                        const permission =
                            await DeviceOrientationEvent.requestPermission();

                        if (permission !== "granted") {

                            document.getElementById("orientationStatus")
                                .textContent =
                                "センサーの使用が許可されませんでした。";

                            return;
                        }

                    } catch (error) {

                        document.getElementById("orientationStatus")
                            .textContent =
                            "センサーの許可取得に失敗しました。";

                        return;
                    }
                }

                window.addEventListener(
                    "deviceorientation",
                    handleOrientation
                );

                document.getElementById("orientationStatus")
                    .textContent =
                    "センサーを取得しています！";

            });


        // センサーの値が変化したとき
        function handleOrientation(event) {

            currentAlpha = event.alpha;
            currentBeta = event.beta;
            currentGamma = event.gamma;

            document.getElementById("alpha").textContent =
                currentAlpha !== null
                    ? currentAlpha.toFixed(1)
                    : "-";

            document.getElementById("beta").textContent =
                currentBeta !== null
                    ? currentBeta.toFixed(1)
                    : "-";

            document.getElementById("gamma").textContent =
                currentGamma !== null
                    ? currentGamma.toFixed(1)
                    : "-";
        }


        // ========================================
        // 写真撮影
        // ========================================

        document.getElementById("cameraInput")
            .addEventListener("change", (event) => {

                const file = event.target.files[0];

                if (!file) {
                    return;
                }


                // ------------------------------
                // 写真を表示
                // ------------------------------

                const imageURL =
                    URL.createObjectURL(file);

                const photoPreview =
                    document.getElementById("photoPreview");

                photoPreview.src = imageURL;
                photoPreview.style.display = "block";


                // ------------------------------
                // 撮影日時
                // ------------------------------

                const timestamp =
                    new Date();

                document.getElementById("timestamp")
                    .textContent =
                    timestamp.toLocaleString();


                // ------------------------------
                // アングル
                // ------------------------------

                document.getElementById("photoAlpha")
                    .textContent =
                    currentAlpha !== null
                        ? currentAlpha.toFixed(1)
                        : "-";

                document.getElementById("photoBeta")
                    .textContent =
                    currentBeta !== null
                        ? currentBeta.toFixed(1)
                        : "-";

                document.getElementById("photoGamma")
                    .textContent =
                    currentGamma !== null
                        ? currentGamma.toFixed(1)
                        : "-";


                document.getElementById("photoStatus")
                    .textContent =
                    "写真を撮影しました！";


                // ------------------------------
                // GPS取得
                // ------------------------------

                if (!navigator.geolocation) {

                    document.getElementById("locationStatus")
                        .textContent =
                        "このブラウザは位置情報に対応していません。";

                    return;
                }

                document.getElementById("locationStatus")
                    .textContent =
                    "位置情報を取得しています...";


                navigator.geolocation.getCurrentPosition(

                    (position) => {

                        const latitude =
                            position.coords.latitude;

                        const longitude =
                            position.coords.longitude;

                        const accuracy =
                            position.coords.accuracy;


                        document.getElementById("latitude")
                            .textContent =
                            latitude;

                        document.getElementById("longitude")
                            .textContent =
                            longitude;

                        document.getElementById("accuracy")
                            .textContent =
                            accuracy.toFixed(1) + " m";


                        document.getElementById("locationStatus")
                            .textContent =
                            "位置情報を取得しました！";

                    },

                    (error) => {

                        document.getElementById("locationStatus")
                            .textContent =
                            "位置情報を取得できませんでした。エラー：" +
                            error.message;

                    }
                );

            });

    </script>

</body>

</html>
